<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Travel Book</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --green:#254f40;
  --green-light:#e8f1eb;
  --cream:#fbf8f2;
  --ink:#25342d;
  --muted:#718078;
  --line:#e6e9e4;
  --orange:#d28b54;
  --red:#d96b60;
  --blue:#4b8ec8;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--cream);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink)
}
button,input,textarea,select{font:inherit}
button,.linkbutton{
  cursor:pointer;border:0;border-radius:13px;
  padding:12px 15px;background:var(--green);
  color:white;font-weight:650
}
button.secondary,.linkbutton.secondary{
  background:white;color:var(--green);
  border:1px solid var(--line)
}
button.small,.linkbutton.small{padding:8px 10px;font-size:13px}
input,textarea,select{
  width:100%;border:1px solid var(--line);
  background:white;border-radius:12px;
  padding:12px;color:var(--ink)
}
textarea{min-height:85px;resize:vertical}
label{
  font-size:13px;color:var(--muted);
  display:block;margin:12px 0 6px
}
.app{max-width:720px;margin:auto;min-height:100vh;padding:0 16px 100px}
.hero{
  background:var(--green);color:white;
  margin:0 -16px;padding:28px 22px 24px;
  border-radius:0 0 25px 25px
}
.hero h1{font-size:27px;margin:0 0 6px}
.hero p{margin:0;color:#d8e5dc}
.content{padding-top:20px}
.sectiontitle{
  display:flex;align-items:center;
  justify-content:space-between;
  gap:10px;margin:18px 0 12px
}
.sectiontitle h2{font-size:19px;margin:0}
.destgrid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.dest{
  padding:15px;background:white;
  border:1px solid var(--line);border-radius:16px;
  text-align:left;color:var(--ink)
}
.dest.active{
  border:2px solid var(--green);
  background:var(--green-light)
}
.dest strong{display:block;font-size:16px}
.dest span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;margin:15px 0}
.toolbar input{flex:1;min-width:0}
.filters{
  display:flex;gap:8px;overflow:auto;margin:12px 0
}
.filters button{
  white-space:nowrap;background:white;
  color:var(--green);border:1px solid var(--line)
}
.filters button.active{
  background:var(--orange);color:white;border-color:var(--orange)
}
.card{
  background:white;border:1px solid var(--line);
  border-radius:18px;padding:15px;margin-bottom:12px;
  box-shadow:0 3px 12px #20392a06
}
.placebody{min-width:0;flex:1}
.placebody h3{margin:0 0 5px;font-size:17px}
.placebody p{
  margin:7px 0;color:var(--muted);
  font-size:13px;white-space:pre-wrap;word-break:break-word
}
.badge{
  display:inline-block;padding:5px 9px;
  border-radius:20px;font-size:11px;
  background:var(--green-light);color:var(--green)
}
.badge.visited{background:#e8eee5;color:#54734c}
.placeactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;padding:30px;color:var(--muted)}
.modalbg{
  position:fixed;inset:0;background:#0007;
  display:flex;align-items:flex-end;
  justify-content:center;z-index:1000
}
.modal{
  background:var(--cream);width:100%;max-width:720px;
  max-height:94vh;overflow:auto;
  border-radius:24px 24px 0 0;padding:20px
}
.modal h2{margin:0 0 12px}
.modalhead{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:15px
}
.close{background:transparent;color:var(--green);font-size:25px;padding:4px 10px}
.save{width:100%;margin-top:18px}
.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  background:#25342d;color:white;
  padding:12px 18px;border-radius:12px;
  z-index:2000;max-width:90%;
  box-shadow:0 5px 25px #0002
}
.hidden{display:none!important}
.loading{text-align:center;padding:40px;color:var(--muted)}

.tabs{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin:18px 0
}
.tab{
  background:white;color:var(--green);
  border:1px solid var(--line)
}
.tab.active{
  background:var(--green);color:white
}
#mainMap{
  height:65vh;min-height:380px;
  border-radius:18px;border:1px solid var(--line);
  overflow:hidden
}
.mapnote{
  color:var(--muted);font-size:13px;margin:10px 0
}
.mapfilter{
  display:flex;gap:8px;overflow:auto;margin:12px 0
}
.mapfilter button{
  background:white;color:var(--green);
  border:1px solid var(--line);white-space:nowrap
}
.mapfilter button.active{
  background:var(--orange);color:white;border-color:var(--orange)
}
#pickerMap{
  height:55vh;min-height:350px;
  border-radius:15px;overflow:hidden
}
.coords{
  background:var(--green-light);
  border-radius:12px;padding:10px;
  font-size:13px;margin-top:10px
}
.linkbutton{
  display:inline-flex;align-items:center;
  justify-content:center;text-decoration:none
}
.leaflet-popup-content{
  font-family:system-ui,sans-serif;
  min-width:150px
}
.popupTitle{font-weight:700;font-size:16px;margin-bottom:5px}
.popupText{font-size:13px;color:#66746d;margin-bottom:8px}
.markerDot{
  width:18px;height:18px;border-radius:50%;
  border:3px solid white;
  box-shadow:0 1px 5px #0005
}
@media(min-width:600px){
  .modalbg{align-items:center}
  .modal{border-radius:24px}
}
</style>
</head>

<body>
<div id="root"></div>

<script>
const SUPABASE_URL='https://gmjfxdbefckdmiktxnpb.supabase.co';

const root=document.getElementById('root');

let sb=null;
let cities=[];
let places=[];
let activeCity='Все';
let activeFilter='all';
let activeView='list';
let editingId=null;

let mainMap=null;
let pickerMap=null;
let pickerMarker=null;
let selectedLat=null;
let selectedLng=null;

const initialCities=[
  'Бангкок','Као Лак','Ко Яо Яй',
  'Патонг','Най Харн','Най Янг'
];

const cityCenters={
  'Бангкок':[13.7563,100.5018],
  'Као Лак':[8.6413,98.2486],
  'Ко Яо Яй':[7.9545,98.5920],
  'Патонг':[7.8965,98.2965],
  'Най Харн':[7.7780,98.3060],
  'Най Янг':[8.0870,98.2990],
  'Все':[7.9,98.4]
};

const $=id=>document.getElementById(id);

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function safeUrl(value){
  if(!value)return '';
  let url=String(value).trim();

  if(!/^https?:\/\//i.test(url)){
    url='https://'+url;
  }

  return /^https?:\/\//i.test(url)?url:'';
}

function toast(message){
  const el=document.createElement('div');
  el.className='toast';
  el.textContent=message;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2800);
}

function getKey(){
  return localStorage.getItem('travelbook_key')||'';
}

function showKeyScreen(){
  root.innerHTML=`
  <div class="app">
    <div class="hero">
      <h1>🧳 Our Travel Book</h1>
      <p>Наш общий дневник путешествий</p>
    </div>
    <div class="card" style="margin-top:25px">
      <h2>Подключение</h2>
      <p>Вставь Publishable key из Supabase.</p>
      <label>Publishable key</label>
      <input id="keyInput" placeholder="sb_publishable_..." autocomplete="off">
      <button style="width:100%;margin-top:15px" onclick="saveKey()">Подключить</button>
      <p style="font-size:12px;color:var(--muted)">
        Нужен только Publishable key. Secret key сюда не вставляй.
      </p>
    </div>
  </div>`;
}

function saveKey(){
  const value=$('keyInput').value.trim();
  if(!value){
    toast('Вставь ключ Supabase');
    return;
  }
  localStorage.setItem('travelbook_key',value);
  init();
}

function init(){
  const key=getKey();

  if(!key){
    showKeyScreen();
    return;
  }

  sb=window.supabase.createClient(SUPABASE_URL,key);
  loadData();
}

async function loadData(){
  root.innerHTML=`
  <div class="app">
    <div class="hero">
      <h1>🧳 Our Travel Book</h1>
      <p>Наш общий дневник путешествий</p>
    </div>
    <div class="loading">Загружаем дневник…</div>
  </div>`;

  const {data:cityData,error:cityError}=await sb
    .from('travel_book_cities')
    .select('*')
    .order('sort_order');

  if(cityError){
    root.innerHTML=`<div class="app"><div class="card">
      <h2>Ошибка загрузки</h2>
      <p>${esc(cityError.message)}</p>
      <button onclick="loadData()">Повторить</button>
    </div></div>`;
    return;
  }

  cities=cityData||[];

  if(!cities.length){
    const inserts=initialCities.map((name,i)=>({
      name,emoji:'📍',sort_order:i+1
    }));

    await sb.from('travel_book_cities').insert(inserts);

    const result=await sb
      .from('travel_book_cities')
      .select('*')
      .order('sort_order');

    cities=result.data||[];
  }

  await loadPlaces();
}

async function loadPlaces(){
  const {data,error}=await sb
    .from('travel_book_places')
    .select('*, travel_book_cities(name)')
    .order('created_at',{ascending:false});

  if(error){
    toast('Ошибка загрузки мест: '+error.message);
    return;
  }

  places=data||[];
  render();
}

function render(){
  const cityNames=['Все',...cities.map(c=>c.name)];

  root.innerHTML=`
  <div class="app">
    <div class="hero">
      <h1>🧳 Our Travel Book</h1>
      <p>Two travelers. One adventure ❤️</p>
    </div>

    <div class="content">
      <div class="tabs">
        <button class="tab ${activeView==='list'?'active':''}"
          onclick="setView('list')">📋 Список</button>
        <button class="tab ${activeView==='map'?'active':''}"
          onclick="setView('map')">🗺️ Карта</button>
      </div>

      ${activeView==='list'?renderListView():renderMapView()}
    </div>
  </div>

  <div id="modalbg" class="modalbg hidden" onclick="backgroundClose(event)">
    <div class="modal">
      <div class="modalhead">
        <h2 id="modalTitle">Добавить место</h2>
        <button class="close" onclick="closeModal()">×</button>
      </div>

      <form id="placeForm" onsubmit="savePlace(event)">
        <label>Название места *</label>
        <input id="name" required placeholder="Например: красивый пляж">

        <label>Город / направление *</label>
        <select id="city" required></select>

        <label>Локация / адрес / ссылка на карту</label>
        <input id="location" placeholder="Google Maps или адрес">

        <label>Координаты на карте</label>
        <button type="button" class="secondary" style="width:100%"
          onclick="openPicker()">
          📍 Выбрать точку на карте
        </button>

        <div id="coordInfo" class="coords">
          Точка на карте не выбрана
        </div>

        <button type="button" class="secondary small"
          style="margin-top:8px"
          onclick="clearCoords()">
          Удалить выбранные координаты
        </button>

        <label>Сайт / Instagram / другая ссылка</label>
        <input id="external" placeholder="https://...">

        <label>Наши заметки</label>
        <textarea id="notes" placeholder="Что хотим увидеть? Советы, цены, впечатления…"></textarea>

        <label>Статус</label>
        <select id="status">
          <option value="want">❤️ Хочу посетить</option>
          <option value="visited">✓ Мы здесь были!</option>
        </select>

        <button class="save" type="submit">Сохранить место</button>
      </form>
    </div>
  </div>

  <div id="pickerbg" class="modalbg hidden">
    <div class="modal">
      <div class="modalhead">
        <h2>📍 Выбрать точку</h2>
        <button class="close" onclick="closePicker()">×</button>
      </div>

      <p class="mapnote">
        Нажми на нужное место на карте. Маркер можно перемещать.
      </p>

      <div id="pickerMap"></div>

      <div id="pickerCoords" class="coords">
        Нажми на карту, чтобы выбрать координаты
      </div>

      <button class="save" onclick="confirmCoords()">
        Сохранить точку
      </button>

      <button class="secondary" style="width:100%;margin-top:8px"
        onclick="closePicker()">
        Отмена
      </button>
    </div>
  </div>`;

  if(activeView==='list'){
    fillCitySelect();
    renderPlacesList();
  }else{
    renderMapViewControls();
    setTimeout(initMainMap,100);
  }
}

function renderListView(){
  const cityNames=['Все',...cities.map(c=>c.name)];

  return `
    <div class="sectiontitle">
      <h2>Наши направления</h2>
    </div>

    <div class="destgrid">
      ${cityNames.map(city=>{
        const count=city==='Все'
          ?places.length
          :places.filter(p=>p.travel_book_cities?.name===city).length;

        return `
        <button class="dest ${activeCity===city?'active':''}"
          onclick="setCity('${esc(city)}')">
          <strong>${city==='Все'?'🌍 Все направления':esc(city)}</strong>
          <span>${count} ${count===1?'место':'мест'}</span>
        </button>`;
      }).join('')}
    </div>

    <div class="toolbar">
      <input id="search" placeholder="🔎 Найти место..."
        oninput="renderPlacesList()">
      <button onclick="openModal()">＋ Добавить</button>
    </div>

    <div class="filters">
      <button class="${activeFilter==='all'?'active':''}"
        onclick="setFilter('all')">Все</button>
      <button class="${activeFilter==='want'?'active':''}"
        onclick="setFilter('want')">❤️ Хочу</button>
      <button class="${activeFilter==='visited'?'active':''}"
        onclick="setFilter('visited')">✓ Были</button>
    </div>

    <div id="list"></div>
  `;
}

function renderMapView(){
  const cityNames=['Все',...cities.map(c=>c.name)];

  return `
    <div class="sectiontitle">
      <h2>Карта наших мест</h2>
      <button class="small" onclick="openModal()">＋ Добавить</button>
    </div>

    <div class="mapfilter">
      ${cityNames.map(city=>`
        <button class="${activeCity===city?'active':''}"
          onclick="setCity('${esc(city)}')">
          ${city==='Все'?'🌍 Все':esc(city)}
        </button>
      `).join('')}
    </div>

    <div class="mapfilter">
      <button class="${activeFilter==='all'?'active':''}"
        onclick="setFilter('all')">Все</button>
      <button class="${activeFilter==='want'?'active':''}"
        onclick="setFilter('want')">❤️ Хочу</button>
      <button class="${activeFilter==='visited'?'active':''}"
        onclick="setFilter('visited')">✓ Были</button>
    </div>

    <div id="mainMap"></div>

    <p class="mapnote">
      ❤️ Красные точки — хотим посетить. 🟢 Зелёные — уже посетили.
    </p>

    <div id="mapList"></div>
  `;
}

function fillCitySelect(){
  const citySelect=$('city');
  if(!citySelect)return;

  citySelect.innerHTML=cities.map(c=>`
    <option value="${c.id}">${esc(c.name)}</option>
  `).join('');
}

function renderPlacesList(){
  const list=$('list');
  if(!list)return;

  const search=$('search')?.value.toLowerCase()||'';

  let filtered=places.filter(p=>{
    const city=p.travel_book_cities?.name||'';

    const cityOk=activeCity==='Все'||city===activeCity;
    const statusOk=activeFilter==='all'||p.status===activeFilter;

    const searchOk=[
      p.name,city,p.notes,p.location_url,p.external_url
    ].join(' ').toLowerCase().includes(search);

    return cityOk&&statusOk&&searchOk;
  });

  if(!filtered.length){
    list.innerHTML=`
      <div class="card empty">
        <div style="font-size:35px">🌴</div>
        <p>Пока здесь нет мест.</p>
        <p>Добавим первое?</p>
      </div>`;
    return;
  }

  list.innerHTML=filtered.map(p=>{
    const city=p.travel_book_cities?.name||'';
    const visited=p.status==='visited';
    const mapUrl=safeUrl(p.location_url);
    const externalUrl=safeUrl(p.external_url);

    return `
    <div class="card">
      <div class="placebody">
        <h3>${esc(p.name)}</h3>

        <span class="badge ${visited?'visited':''}">
          ${visited?'✓ Посетили':'❤️ Хотим посетить'}
        </span>

        <p>📍 ${esc(city)}</p>

        ${p.notes?`<p>${esc(p.notes)}</p>`:''}

        ${p.latitude!=null&&p.longitude!=null
          ?`<p>🗺️ Координаты выбраны</p>`
          :`<p style="color:#b07b42">📍 Точка на карте не выбрана</p>`}

        <div class="placeactions">
          ${mapUrl?`
            <a class="linkbutton small secondary"
              href="${esc(mapUrl)}"
              target="_blank" rel="noopener noreferrer">
              📍 Google Maps
            </a>`:''}

          ${externalUrl?`
            <a class="linkbutton small secondary"
              href="${esc(externalUrl)}"
              target="_blank" rel="noopener noreferrer">
              🔗 Ссылка
            </a>`:''}

          <button class="small secondary"
            onclick="editPlace(${p.id})">✏️</button>

          <button class="small secondary"
            onclick="toggleStatus(${p.id})">
            ${visited?'❤️ Хочу':'✓ Были'}
          </button>

          <button class="small secondary"
            onclick="deletePlace(${p.id})">🗑</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderMapViewControls(){
  // The controls are already rendered in renderMapView.
}

function setCity(city){
  activeCity=city;
  render();
}

function setFilter(filter){
  activeFilter=filter;
  render();
}

function setView(view){
  activeView=view;
  mainMap=null;
  render();
}

function initMainMap(){
  const mapElement=$('mainMap');
  if(!mapElement)return;

  if(mainMap){
    mainMap.remove();
    mainMap=null;
  }

  const center=cityCenters[activeCity]||cityCenters['Все'];

  mainMap=L.map('mainMap').setView(center,activeCity==='Все'?7:11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap contributors',
    maxZoom:19
  }).addTo(mainMap);

  const filtered=places.filter(p=>{
    const city=p.travel_book_cities?.name||'';
    const cityOk=activeCity==='Все'||city===activeCity;
    const statusOk=activeFilter==='all'||p.status===activeFilter;
    return cityOk&&statusOk;
  });

  const points=filtered.filter(p=>p.latitude!=null&&p.longitude!=null);

  points.forEach(p=>{
    const visited=p.status==='visited';
    const color=visited?'#388b62':'#d96b60';

    const marker=L.circleMarker([p.latitude,p.longitude],{
      radius:9,
      color:'#ffffff',
      weight:3,
      fillColor:color,
      fillOpacity:1
    }).addTo(mainMap);

    const popup=`
      <div class="popupTitle">${esc(p.name)}</div>
      <div class="popupText">${esc(p.travel_book_cities?.name||'')}</div>
      ${p.notes?`<div class="popupText">${esc(p.notes)}</div>`:''}
      <div style="margin-top:8px">
        ${p.status==='visited'?'✓ Посетили':'❤️ Хотим посетить'}
      </div>
      ${p.location_url?`
        <div style="margin-top:10px">
          <a href="${esc(safeUrl(p.location_url))}"
            target="_blank" rel="noopener noreferrer">
            Открыть Google Maps
          </a>
        </div>`:''}
      <div style="margin-top:10px">
        <button onclick="editPlace(${p.id})"
          style="padding:7px 10px;font-size:12px">
          ✏️ Редактировать
        </button>
      </div>
    `;

    marker.bindPopup(popup);
  });

  if(points.length>0){
    const bounds=L.latLngBounds(points.map(p=>[p.latitude,p.longitude]));
    mainMap.fitBounds(bounds,{padding:[30,30],maxZoom:13});
  }

  const mapList=$('mapList');

  if(mapList){
    if(!points.length){
      mapList.innerHTML=`
        <div class="card empty">
          <p>На карте пока нет точек с координатами.</p>
          <p>Добавь место и выбери точку на карте 📍</p>
        </div>`;
    }else{
      mapList.innerHTML=`
        <div class="sectiontitle">
          <h2>Места на карте (${points.length})</h2>
        </div>
        ${points.map(p=>`
          <div class="card">
            <strong>${esc(p.name)}</strong>
            <p style="color:var(--muted);font-size:13px">
              ${esc(p.travel_book_cities?.name||'')}
              · ${p.status==='visited'?'✓ Посетили':'❤️ Хотим'}
            </p>
            <button class="small secondary"
              onclick="focusPoint(${p.latitude},${p.longitude})">
              📍 Показать на карте
            </but
